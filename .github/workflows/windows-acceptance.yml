name: Windows acceptance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: carcrow-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify credential-free source
        shell: pwsh
        run: |
          if (Test-Path 'electron/provisioned-key.cjs') { throw 'Private credentials must not enter CI.' }
          if (Test-Path '.env') { throw 'Private environment files must not enter CI.' }
      - name: Install dependencies
        run: npm ci
      - name: Verify data and agent behavior
        run: npm test
      - name: Verify Worker restrictions
        run: |
          npm ci --prefix worker
          npm test --prefix worker
      - name: Build interface
        run: npm run build
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/cache@v5
        id: model-cache
        with:
          path: models/embeddinggemma-2/
          key: embeddinggemma2-windows-reduced-${{ hashFiles('scripts/export-embeddinggemma2.py', 'scripts/requirements-model.txt') }}
      - uses: actions/cache@v5
        with:
          path: ~/AppData/Local/electron-builder/Cache
          key: electron-builder-windows-${{ hashFiles('package-lock.json') }}
      - name: Prepare the real on-device recommendation model
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: |
          python -m pip install -r scripts/requirements-model.txt
          if ($LASTEXITCODE -ne 0) { throw 'Model build dependencies failed' }
          python scripts/export-embeddinggemma2.py
          if ($LASTEXITCODE -ne 0) { throw 'Model export failed' }
      - name: Verify the on-device model
        run: node scripts/check-embeddings.cjs
      - name: Save the verified portable model
        uses: actions/upload-artifact@v7
        with:
          name: embeddinggemma2-text-model
          path: models/embeddinggemma-2/
          retention-days: 7
      - name: Package Windows without publishing
        run: npx electron-builder --publish never --win zip nsis --x64 --config.nsis.artifactName=CarCrow-Windows-Setup.exe --config.win.artifactName=CarCrow-Windows.zip
      - name: Verify portable app and actual installation
        shell: pwsh
        run: ./scripts/verify-windows.ps1 -SkipBuild -InstallOnEphemeralRunner
      - name: Save verified Windows packages
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: carcrow-package-windows
          path: |
            release/CarCrow-Windows.zip
            release/CarCrow-Windows-Setup.exe
          compression-level: 0
          retention-days: 14
      - name: Save test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-test-evidence
          path: test-results/
          if-no-files-found: warn
          retention-days: 14
