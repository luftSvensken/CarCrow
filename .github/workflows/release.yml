name: Release CarCrow

on:
  push:
    branches: [main]
    paths:
      - package.json
      - .github/workflows/release.yml
  workflow_dispatch:
    inputs:
      version:
        description: 'Version in package.json, for example 0.7.0'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: carcrow-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify public main branch and version
        id: release
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          IS_PRIVATE: ${{ github.event.repository.private }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$IS_PRIVATE" = false
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const version=JSON.parse(fs.readFileSync('package.json','utf8')).version;
          if(!/^\d+\.\d+\.\d+$/.test(version)||(process.env.REQUESTED_VERSION&&process.env.REQUESTED_VERSION!==version))throw new Error('Requested version does not match package.json');
          const response=await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/releases/tags/v${version}`,{headers:{Accept:'application/vnd.github+json',Authorization:`Bearer ${process.env.GH_TOKEN}`}});
          if(![200,404].includes(response.status))throw new Error(`Release check failed: HTTP ${response.status}`);
          if(response.status===200&&process.env.GITHUB_EVENT_NAME==='workflow_dispatch')throw new Error('This version already has a release');
          if(response.status===404){
            const latest=await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/releases/latest`,{headers:{Accept:'application/vnd.github+json',Authorization:`Bearer ${process.env.GH_TOKEN}`}});
            if(![200,404].includes(latest.status))throw new Error(`Latest release check failed: HTTP ${latest.status}`);
            if(latest.status===200){
              const previous=String((await latest.json()).tag_name||'').replace(/^v/,'');
              if(!/^\d+\.\d+\.\d+$/.test(previous))throw new Error('Latest release has an unsupported version');
              const currentParts=version.split('.').map(Number),previousParts=previous.split('.').map(Number),changed=currentParts.findIndex((n,i)=>n!==previousParts[i]);
              if(changed<0||currentParts[changed]<previousParts[changed])throw new Error('A new release must be newer than the latest published version');
            }
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`version=${version}\npublish=${response.status===404}\n`);
          NODE
  windows:
    needs: validate
    if: needs.validate.outputs.publish == 'true'
    uses: ./.github/workflows/windows-acceptance.yml
  mac:
    needs: windows
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            asset: CarCrow-Mac-Apple-Silicon.zip
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          name: embeddinggemma2-text-model
          path: models/embeddinggemma-2/
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Package Mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          TARGET_ARCH: ${{ matrix.arch }}
        run: npx electron-builder --mac dir --$TARGET_ARCH --publish never
      - name: Verify packaged Mac app
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          CARCROW_SCREENSHOTS: test-results/mac
        run: |
          if [ "$TARGET_ARCH" = arm64 ]; then export CARCROW_EXECUTABLE="$PWD/release/mac-arm64/CarCrow.app/Contents/MacOS/CarCrow"; else export CARCROW_EXECUTABLE="$PWD/release/mac/CarCrow.app/Contents/MacOS/CarCrow"; fi
          node scripts/smoke.cjs
          node scripts/smoke06.cjs
          node scripts/smoke07.cjs
          node scripts/smoke-search-all.cjs
      - name: Archive Mac app
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          ASSET: ${{ matrix.asset }}
        run: |
          if [ "$TARGET_ARCH" = arm64 ]; then APP=release/mac-arm64/CarCrow.app; else APP=release/mac/CarCrow.app; fi
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent "$APP" "release/$ASSET"
      - name: Verify Mac archive signatures and tamper protection
        env:
          ASSET: ${{ matrix.asset }}
        run: node scripts/verify-mac-package.cjs "release/$ASSET"
      - name: Verify actual Mac update and preserved user data
        env:
          CARCROW_AUTOMATIC_UPDATE: '1'
          TARGET_ARCH: ${{ matrix.arch }}
          ASSET: ${{ matrix.asset }}
        run: |
          if [ "$TARGET_ARCH" = arm64 ]; then export CARCROW_EXECUTABLE="$PWD/release/mac-arm64/CarCrow.app/Contents/MacOS/CarCrow"; else export CARCROW_EXECUTABLE="$PWD/release/mac/CarCrow.app/Contents/MacOS/CarCrow"; fi
          export CARCROW_UPDATE_PACKAGE="$PWD/release/$ASSET"
          node scripts/update-install.cjs
      - uses: actions/upload-artifact@v7
        with:
          name: carcrow-package-${{ matrix.arch }}
          path: release/${{ matrix.asset }}
          compression-level: 0
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mac-test-evidence-${{ matrix.arch }}
          path: test-results/
          retention-days: 14
  publish:
    needs: [validate, windows, mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: carcrow-package-*
          merge-multiple: true
          path: release/
      - name: Publish verified packages
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
          GH_REPO: ${{ github.repository }}
        run: |
          test -f release/CarCrow-Mac-Apple-Silicon.zip
          test -f release/CarCrow-Windows.zip
          test -f release/CarCrow-Windows-Setup.exe
          gh release create "v$VERSION" release/* --target "$GITHUB_SHA" --title "CarCrow $VERSION" --generate-notes --fail-on-no-commits
